<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>교실 퀴즈 시트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: top tab bar (퀴즈 풀기 / 교사 시트). Play = purple game card with a game-mode picker; Sheet = spreadsheet-style table, one row per question, row labels change with question type. */
:root{
  --bg:#eef5fb; --card:#ffffff; --ink:#12263f; --ink2:#4a627d; --line:#cddbe9; --head:#e4f0fb; --rowalt:#f6fafd;
  --sky:#1f8fe0; --sun:#ffc533; --sun-ink:#4d3600; --coral:#e5484d; --mint:#12a46a; --warn-bg:#fff1d6; --err-bg:#ffe3e1;
  --a1:#e5484d; --a2:#1f8fe0; --a3:#e09a00; --a4:#16a56a; --shadow:0 8px 26px rgba(18,38,63,.13);
  --f-head:'Jua','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1726; --card:#12263f; --ink:#f1f6fb; --ink2:#a9bdd3; --line:#2b4766; --head:#1a3556; --rowalt:#0f2138;
  --sky:#59b4f5; --sun:#ffd25a; --sun-ink:#3b2900; --coral:#ff7b70; --mint:#35d39b; --warn-bg:#3a3314; --err-bg:#4a2220;
  --a1:#d93a40; --a2:#1c7cc4; --a3:#c98800; --a4:#12915a; --shadow:0 8px 26px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1726; --card:#12263f; --ink:#f1f6fb; --ink2:#a9bdd3; --line:#2b4766; --head:#1a3556; --rowalt:#0f2138;
  --sky:#59b4f5; --sun:#ffd25a; --sun-ink:#3b2900; --coral:#ff7b70; --mint:#35d39b; --warn-bg:#3a3314; --err-bg:#4a2220;
  --a1:#d93a40; --a2:#1c7cc4; --a3:#c98800; --a4:#12915a; --shadow:0 8px 26px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);margin:0;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:var(--f-head);font-weight:400;font-size:clamp(24px,4vw,34px);margin:0;flex:1;min-width:200px;text-wrap:balance}
.tabs{display:flex;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:8px 16px;font-weight:700;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--sky);color:#fff}
.btn{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;min-height:42px}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.primary[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--coral)}
.btn.armed{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.note{background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:14px}
[hidden]{display:none!important}

/* ---------- play ---------- */
.game{position:relative;background:linear-gradient(160deg,#5b3fd0,#2a1a7a);color:#fff;border-radius:22px;box-shadow:var(--shadow);padding:clamp(16px,3vw,32px);min-height:min(640px,calc(100dvh - 140px));display:flex;flex-direction:column;gap:14px;overflow:hidden}
.game h2{font-family:var(--f-head);font-weight:400;margin:0;text-wrap:balance}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.pill{background:rgba(255,255,255,.16);border-radius:99px;padding:3px 14px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:6px}
.pill.cur{background:#ffc533;color:#4d3600}
.pill svg{width:18px;height:18px;fill:currentColor}
.sp{flex:1}
.timer{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;flex:none}
.timer i{display:block;height:100%;width:100%;background:#ffc533;transform-origin:left;border-radius:99px}
.banner{text-align:center;background:rgba(255,197,51,.95);color:#4d3600;border-radius:12px;padding:6px 12px;font-weight:900}
.qt{font-family:var(--f-head);font-size:clamp(21px,3.4vw,36px);line-height:1.4;text-align:center;margin:0;padding:10px 0;display:flex;align-items:center;justify-content:center;min-height:96px;text-wrap:balance}
.badge{align-self:center;background:rgba(255,255,255,.16);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-content:stretch}
@media(max-width:620px){.ans{grid-template-columns:1fr}}
.ans button,.tile{border:0;border-radius:16px;color:#fff;display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:clamp(17px,2.4vw,25px);font-weight:700;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.28);min-height:78px;position:relative}
.ans button:active,.tile:active{transform:translateY(3px)}
.ans button svg,.tile svg{width:32px;height:32px;flex:none;fill:#fff}
.ans button[data-c="0"],.tile[data-c="0"]{background:var(--a1)}.ans button[data-c="1"],.tile[data-c="1"]{background:var(--a2)}
.ans button[data-c="2"],.tile[data-c="2"]{background:var(--a3)}.ans button[data-c="3"],.tile[data-c="3"]{background:var(--a4)}
.ans.done button{opacity:.35;pointer-events:none}
.ans.done button.right{opacity:1;outline:5px solid #fff}
.ans.done button.wrong{opacity:.6;text-decoration:line-through}
.tf button{justify-content:center;font-family:var(--f-head);font-size:clamp(26px,4vw,44px);min-height:150px}
.tf button svg{width:48px;height:48px}
.tile .no{position:absolute;right:12px;top:8px;background:#fff;color:#1b1340;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:900;font-size:16px}
.tile.picked{opacity:.55;pointer-events:none}
.work{display:flex;flex-direction:column;gap:12px;align-items:center;flex:1;justify-content:center;width:100%}
.typein{font-size:clamp(22px,3.4vw,34px);text-align:center;border:0;border-radius:16px;padding:14px 18px;width:min(100%,560px);min-height:64px;background:#fff;color:#1b1340}
.hint2{font-size:15px;opacity:.85;margin:0}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
@media(max-width:620px){.tiles{grid-template-columns:1fr}}
.slw{width:min(100%,640px);display:flex;flex-direction:column;gap:10px;align-items:center}
.slv{font-family:var(--f-head);font-size:clamp(44px,8vw,80px);color:#ffd25a;line-height:1}
.slw input[type=range]{width:100%;height:36px;accent-color:#ffc533}
.slr{display:flex;width:100%;justify-content:space-between;font-weight:700;font-size:15px}
.step{border:0;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-size:28px;font-weight:900;width:56px;height:52px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.big{font-family:var(--f-head);font-size:clamp(34px,6vw,60px);line-height:1.2;text-wrap:balance}
.center p{margin:0;font-size:clamp(16px,2vw,21px);line-height:1.6;max-width:56ch}
.nick{font-size:22px;border-radius:14px;border:0;padding:10px 18px;text-align:center;width:min(100%,340px);min-height:46px;background:#fff;color:#1b1340}
.qbtn{border:0;border-radius:16px;background:#ffc533;color:#4d3600;font-family:var(--f-head);font-size:clamp(20px,2.6vw,28px);padding:10px 34px;box-shadow:0 6px 0 #b78600;min-height:48px}
.qbtn[disabled]{opacity:.5}
.qbtn.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;font-size:18px}
.res{border-radius:20px;padding:18px 26px;width:100%;max-width:640px;font-size:clamp(16px,2vw,20px);line-height:1.6;background:rgba(255,255,255,.14)}
.res.ok{background:rgba(22,181,122,.35)}.res.no{background:rgba(255,90,77,.35)}
.res .hd{font-family:var(--f-head);font-size:clamp(28px,4.4vw,44px);display:block;line-height:1.2}
.pts{font-family:var(--f-head);color:#ffd25a;font-size:28px}
.vs{display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.vs span{background:rgba(0,0,0,.22);border-radius:99px;padding:2px 14px;font-weight:700;font-size:15px}
.opts{display:flex;gap:16px;align-items:center;font-size:16px;flex-wrap:wrap;justify-content:center}
.opts input{width:22px;height:22px;accent-color:#ffc533}
.stars{display:flex;gap:8px;justify-content:center}.stars svg{width:56px;height:56px}
.sum{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sum div{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 20px;font-size:15px}
.sum b{display:block;font-family:var(--f-head);font-weight:400;font-size:32px;color:#ffd25a}
.rev{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rev i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900}
.rev i.ok{background:#16b57a}.rev i.no{background:#ff5a4d}
.missed{background:rgba(0,0,0,.22);border-radius:14px;padding:10px 16px;font-size:15px;text-align:left;max-width:640px;width:100%}
.missed div+div{margin-top:8px}
.rank{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.rank div{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 16px;font-weight:700;font-size:20px}
.rank div.win{background:#ffc533;color:#4d3600}
.rank b{font-family:var(--f-head);font-weight:400;font-size:28px;min-width:34px}
.rank span{flex:1;text-align:left}
#conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* home: game-mode picker */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:720px}
@media(max-width:560px){.modes{grid-template-columns:1fr}}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;border:3px solid transparent;border-radius:16px;background:rgba(255,255,255,.13);color:#fff;padding:12px 14px;min-height:84px}
.mode:hover{background:rgba(255,255,255,.2)}
.mode[aria-pressed="true"]{border-color:#ffc533;background:rgba(255,197,51,.2)}
.mode svg{width:38px;height:38px;flex:none;fill:#ffc533}
.mode b{display:block;font-family:var(--f-head);font-weight:400;font-size:22px;line-height:1.2}
.mode small{display:block;font-size:14px;opacity:.9;line-height:1.4;margin-top:2px}
.teams{display:flex;flex-direction:column;gap:8px;align-items:center}
.teams .row2 input{font-size:18px;border:0;border-radius:12px;padding:8px 12px;width:150px;min-height:44px;text-align:center;background:#fff;color:#1b1340}
.seg{display:flex;gap:6px}
.seg button{border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;padding:6px 14px;min-height:40px}
.seg button[aria-pressed="true"]{background:#ffc533;color:#4d3600}

/* ---------- sheet ---------- */
.sheet{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:clamp(14px,2.5vw,24px);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-head);font-weight:400;font-size:26px;margin:0}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.meta label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--ink2)}
.meta input[type=text],.meta input[type=number]{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:42px}
.meta input[type=number]{width:110px}
.meta .title{min-width:min(100%,320px);flex:1}
fieldset.mm{border:2px solid var(--line);border-radius:12px;padding:6px 12px 10px;margin:0;display:flex;gap:14px;flex-wrap:wrap}
fieldset.mm legend{font-size:14px;font-weight:700;color:var(--ink2);padding:0 6px}
fieldset.mm label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-weight:500}
fieldset.mm input{width:20px;height:20px;accent-color:var(--sky)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select{border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:42px;padding:6px 8px;font-weight:700}
.status{font-weight:700;font-size:14px;color:var(--ink2)}
.status.dirty{color:var(--coral)}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:1500px;font-size:14.5px}
th{background:var(--head);text-align:left;padding:8px 10px;white-space:nowrap;font-size:13px;letter-spacing:.04em}
td{padding:6px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(even){background:var(--rowalt)}
tr.bad{background:var(--err-bg)!important}
td.n{font-family:var(--f-head);font-size:20px;text-align:center;width:44px;padding-top:12px}
td textarea,td input,td select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;resize:vertical;min-height:38px}
td textarea{min-height:76px;min-width:200px}
td.ty{min-width:130px}
td.ty .h{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.35}
td.opt{min-width:140px}
td input[disabled]{opacity:.5;background:var(--rowalt)}
td.opt input.right{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint)}
td.an{min-width:96px}
td.an span{color:var(--ink2);font-size:13px}
td.tm{min-width:80px}
td.ac{white-space:nowrap;min-width:160px}
td.ac .btn{margin:0 2px 4px 0}
.err{color:var(--coral);font-size:12.5px;font-weight:700;margin-top:4px}
.help{font-size:14px;color:var(--ink2);margin:0}
.empty{padding:26px;text-align:center;color:var(--ink2)}
</style>

<div class="wrap">
  <header>
    <h1 id="pageTitle">퀴즈</h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabPlay" aria-selected="true">퀴즈 풀기</button>
      <button role="tab" id="tabSheet" aria-selected="false" hidden>교사 시트</button>
    </div>
  </header>
  <div class="note" id="sync" hidden></div>

  <section id="play"><div class="game" id="game" aria-live="polite"></div></section>

  <section id="sheetPane" hidden>
    <div class="sheet">
      <h2>교사 시트</h2>
      <p class="help" id="modeHelp"></p>
      <div class="meta">
        <label class="title">퀴즈 제목 (다른 학습 주제로 바꿀 수 있어요)<input type="text" id="mTitle" maxlength="40" placeholder="예: 3단원 분수 퀴즈"></label>
        <label class="title">주제 설명 (선택, 시작 화면에 보여요)<input type="text" id="mDesc" maxlength="80" placeholder="예: 분수의 덧셈과 뺄셈"></label>
        <label>기본 시간(초)<input id="mTime" type="number" min="0" max="120" inputmode="numeric"></label>
        <span class="help">0초는 시간 제한 없음</span>
      </div>
      <fieldset class="mm"><legend>학생이 고를 수 있는 게임 방식</legend>
        <label><input type="checkbox" data-mode="classic">클래식</label>
        <label><input type="checkbox" data-mode="team">팀 대결</label>
        <label><input type="checkbox" data-mode="ghost">고스트 모드</label>
        <label><input type="checkbox" data-mode="practice">연습 모드</label>
      </fieldset>
      <div class="tools">
        <button class="btn primary" id="saveBtn">저장하기</button>
        <select id="newType" aria-label="새 문제 유형"></select>
        <button class="btn" id="addBtn">+ 문제 추가</button>
        <button class="btn" id="expBtn">파일로 내보내기</button>
        <button class="btn" id="impBtn">파일 가져오기</button>
        <button class="btn danger" id="newBtn">새 주제로 시작 (문제 비우기)</button>
        <button class="btn danger" id="resetBtn">예시 문제로 되돌리기</button>
        <input type="file" id="impFile" accept=".json,application/json" hidden>
        <span class="status" id="status" role="status"></span>
      </div>
      <div class="tw"><table>
        <thead><tr><th>번호</th><th>유형</th><th>문제</th><th>보기·답 1</th><th>보기·답 2</th><th>보기·답 3</th><th>보기·답 4</th><th>정답</th><th>해설 (정답 후 표시)</th><th>시간(초)</th><th>도구</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <p class="help">유형을 바꾸면 보기·답 칸의 뜻이 달라져요. 객관식은 보기 2개 이상, 단답형은 인정할 정답, 순서 맞추기는 위에서 아래로 올바른 순서, 슬라이더는 최솟값·최댓값·정답·허용 오차를 적어요. 시간 칸을 비우면 기본 시간을 써요. 수정한 뒤에는 꼭 <b>저장하기</b>를 눌러요.</p>
    </div>
  </section>
</div>

<script>
/* ---------- types, modes, data ---------- */
const TYPES={
 choice:{label:'객관식',hint:'보기 중 정답 1개를 골라요',ph:k=>`보기 ${k+1}`},
 tf:{label:'O/X',hint:'맞아요(O) 또는 틀려요(X)',ph:null},
 type:{label:'단답형',hint:'학생이 직접 입력해요. 인정할 답을 여러 개 적을 수 있어요',ph:k=>`인정할 정답 ${k+1}`},
 order:{label:'순서 맞추기',hint:'위→아래가 올바른 순서예요. 학생에게는 섞여 보여요',ph:k=>`${k+1}번째`},
 slider:{label:'슬라이더(숫자)',hint:'학생이 막대로 숫자를 골라요',ph:k=>['최솟값','최댓값','정답','허용 오차(±)'][k]}};
const MODES={
 classic:{label:'클래식',desc:'혼자서 빠르고 정확하게! 점수와 연속 정답 보너스를 모아요.',icon:'<svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.7 7.2L12 17.8 5.6 21.5l1.7-7.2L2 9.6 9 9z"/></svg>'},
 team:{label:'팀 대결',desc:'팀끼리 번갈아 풀어요. 틀리면 다음 팀이 절반 점수로 뺏을 수 있어요.',icon:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.5"/><circle cx="17" cy="9" r="3"/><path d="M2 20c0-4 3-6.5 6-6.5s6 2.500 6 6.500zM14.500 20c.3-2.500 1.700-4.500 4-5 2.200.2 3.500 2 3.500 5z"/></svg>'},

const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const num=s=>{const v=parseFloat(String(s).replace(/,/g,''));return Number.isFinite(v)?v:NaN};
const normTxt=s=>String(s).toLowerCase().replace(/[\s.,!?'"“”‘’~·\-]/g,'');
function normalize(d){
  const modes=(Array.isArray(d?.modes)?d.modes:Object.keys(MODES)).filter(m=>MODES[m]);
  const out={title:String(d?.title||DEFAULT.title).slice(0,40),desc:String(d?.desc??'').slice(0,80),time:Math.max(0,Math.min(120,Number.isFinite(+d?.time)?Math.round(+d.time):20)),modes:modes.length?modes:Object.keys(MODES),questions:[]};
  (Array.isArray(d?.questions)?d.questions:[]).slice(0,50).forEach(x=>{
    const type=TYPES[x?.type]?x.type:'choice';
    const o=[0,1,2,3].map(i=>String(x?.o?.[i]??'').slice(0,120));
    out.questions.push({type,q:String(x?.q??'').slice(0,300),o,a:Math.max(0,Math.min(type==='tf'?1:3,+x?.a||0)),e:String(x?.e??'').slice(0,400),t:Math.max(0,Math.min(300,Math.round(+x?.t||0)))});});
  return out;}
function sl(q){const [mn,mx,c,t]=q.o.map(num);return{mn,mx,c,t}}
function problems(q){const p=[];if(!q.q.trim())p.push('문제를 적어요');
  const n=q.o.filter(x=>x.trim()).length;
  if(q.type==='choice'){if(n<2)p.push('보기를 2개 이상 적어요');if(!q.o[q.a]?.trim())p.push('정답이 빈 보기예요')}
  else if(q.type==='type'){if(n<1)p.push('인정할 정답을 1개 이상 적어요')}
  else if(q.type==='order'){if(n<2)p.push('순서 칸을 2개 이상 적어요')}
  else if(q.type==='slider'){const {mn,mx,c,t}=sl(q);
    if(![mn,mx,c,t].every(Number.isFinite))p.push('최솟값·최댓값·정답·허용 오차를 숫자로 적어요 (허용 오차는 0도 가능)');
    else{if(!(mn<mx))p.push('최댓값이 최솟값보다 커야 해요');else if(c<mn||c>mx)p.push('정답은 최솟값과 최댓값 사이예요');if(t<0)p.push('허용 오차는 0 이상이에요')}}
  return p;}
const validList=d=>d.questions.filter(q=>!problems(q).length);
function correctText(q){
  if(q.type==='choice')return q.o[q.a];
  if(q.type==='tf')return q.a===0?'맞아요 (O)':'틀려요 (X)';
  if(q.type==='type')return q.o.filter(x=>x.trim()).join(' / ');
  if(q.type==='order')return q.o.filter(x=>x.trim()).join(' → ');
  const {c,t}=sl(q);return t>0?`${c} (±${t}까지 정답)`:String(c);}
function check(q,v){
  if(q.type==='choice'||q.type==='tf')return v===q.a;
  if(q.type==='type'){const x=normTxt(v);return !!x&&q.o.some(a=>a.trim()&&normTxt(a)===x)}
  if(q.type==='order'){const items=q.o.filter(x=>x.trim());return Array.isArray(v)&&v.length===items.length&&v.every((t,i)=>t===items[i])}
  const {c,t}=sl(q);return Number.isFinite(v)&&Math.abs(v-c)<=t+1e-9;}

const LS='p38quiz.v2';
function lsGet(){try{const t=localStorage.getItem(LS);return t?normalize(JSON.parse(t)):null}catch(e){return null}}

async function init(){

    storeKind='db';canTeach=user?await user.canEdit():false;
    docRef=db.doc('quiz/set');
    const slow=setTimeout(()=>{if(!loaded)showSync('저장된 문제를 아직 불러오지 못했어요. 기본 문제로 시작할 수 있어요.')},10000);
    docRef.onSnapshot(snap=>{
      loaded=true;clearTimeout(slow);if(!snap.fromCache)showSync('');
      saved=snap.exists?normalize(snap.data()):clone(DEFAULT);
      if(!dirty){draft=clone(saved);fillSheet()}
      renderHomeIfIdle();setTitle();
    },err=>{clearTimeout(slow);showSync('문제를 불러오지 못해서 기본 문제를 보여 줘요.')});
  }else{
    storeKind='local';canTeach=true;const l=lsGet();if(l){saved=l;draft=clone(l)}loaded=true;
    showSync('이 화면에서는 공유 저장을 쓸 수 없어요. 수정한 문제는 이 기기의 이 브라우저에만 저장돼요.');
  }
  $('#tabSheet').hidden=!canTeach;
  $('#modeHelp').textContent=storeKind==='db'?'저장하면 같은 링크로 들어오는 학생 화면에 바로 반영돼요.':'지금은 이 기기에만 저장돼요. 다른 기기의 학생 화면에는 보이지 않아요.';
  fillSheet();setTitle();renderHomeIfIdle();
  if(location.hash==='#sheet'&&canTeach)tab('sheet');

function showSync(t){const s=$('#sync');s.hidden=!t;s.textContent=t}
function setTitle(){$('#pageTitle').textContent=saved.title;try{document.title=saved.title}catch(e){}}

function el(t,a={},kids=[]){const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k==='text')e.textContent=a[k];else e.setAttribute(k,a[k])}kids.forEach(c=>e.append(c));return e}
const rows=$('#rows');
function fillTypeSelect(){const s=$('#newType');Object.entries(TYPES).forEach(([k,v])=>s.append(el('option',{value:k,text:'새 문제: '+v.label})))}
function fillSheet(){$('#mTitle').value=draft.title;$('#mDesc').value=draft.desc||'';$('#mTime').value=draft.time;
  document.querySelectorAll('[data-mode]').forEach(c=>c.checked=draft.modes.includes(c.dataset.mode));buildRows();updateStatus()}
function buildRows(){
  rows.replaceChildren();
  if(!draft.questions.length){rows.append(el('tr',{},[el('td',{colspan:11,class:'empty',text:'문제가 없어요. "+ 문제 추가"를 눌러 첫 문제를 만들어요.'})]));return}

}
function buildRow(q,i){

    if(q.type==='tf')q.a=q.a>1?0:q.a;touched.add(q);dirty=true;const nr=buildRow(q,i);tr.replaceWith(nr);nr.querySelector('select').focus();updateStatus()};

  tm.oninput=()=>{q.t=Math.max(0,Math.min(300,Math.round(+tm.value||0)));touch(tr,q)};tr.append(el('td',{class:'tm'},[tm]));

  ac.append(mk('▲',`${i+1}번 위로`,()=>move(i,-1)),mk('▼',`${i+1}번 아래로`,()=>move(i,1)),mk('복제',`${i+1}번 복제`,()=>dup(i)),
    mk('삭제',`${i+1}번 삭제`,b=>{if(b.dataset.arm){del(i)}else{b.dataset.arm=1;b.textContent='정말?';b.classList.add('armed');setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent='삭제';b.classList.remove('armed')}},3000)}},'danger'));
  tr.append(ac);paintRow(tr,q);return tr}
const touched=new WeakSet();
function paintRow(tr,q){const p=problems(q);
  tr.classList.toggle('bad',p.length>0&&touched.has(q));
  tr.querySelector('.err').textContent=touched.has(q)?p.join(' · '):'';
  tr.querySelectorAll('td.opt input').forEach((inp,k)=>inp.classList.toggle('right',q.type==='choice'&&k===q.a&&!!q.o[k].trim()))}
function touch(tr,q){touched.add(q);dirty=true;paintRow(tr,q);updateStatus()}
function updateStatus(){const s=$('#status');const bad=draft.questions.filter(q=>problems(q).length).length;
  const txt=[`문제 ${draft.questions.length}개`];if(!draft.title.trim())txt.push('제목을 적어요');if(bad)txt.push(`고칠 곳 ${bad}개`);if(dirty)txt.push('저장 안 된 변경 있음');
  s.textContent=txt.join(' · ');s.classList.toggle('dirty',dirty||bad>0);
  $('#saveBtn').disabled=!dirty||bad>0||!draft.questions.length||!draft.modes.length||!draft.title.trim();
  document.querySelectorAll('#rows tr[data-i]').forEach(tr=>paintRow(tr,draft.questions[+tr.dataset.i]));}
function structural(){dirty=true;draft.questions.forEach(q=>touched.add(q));buildRows();updateStatus()}
function move(i,d){const j=i+d;if(j<0||j>=draft.questions.length)return;[draft.questions[i],draft.questions[j]]=[draft.questions[j],draft.questions[i]];structural();focusRow(j,'button')}
function dup(i){if(draft.questions.length>=50)return;draft.questions.splice(i+1,0,clone(draft.questions[i]));structural();focusRow(i+1)}
function del(i){draft.questions.splice(i,1);structural()}
function focusRow(i,w='textarea'){const tr=rows.querySelector(`tr[data-i="${i}"]`);if(tr){tr.scrollIntoView({block:'nearest'});tr.querySelector(w)?.focus()}}
$('#addBtn').onclick=()=>{if(draft.questions.length>=50){flash('문제는 최대 50개예요.');return}
  const type=$('#newType').value;const q={type,q:'',o:type==='slider'?['0','100','50','0']:['','','',''],a:0,e:'',t:0};draft.questions.push(q);dirty=true;buildRows();updateStatus();focusRow(draft.questions.length-1)};
$('#mTitle').oninput=e=>{draft.title=e.target.value;dirty=true;updateStatus()};
$('#mDesc').oninput=e=>{draft.desc=e.target.value;dirty=true;updateStatus()};
$('#mTime').oninput=e=>{draft.time=Math.max(0,Math.min(120,Math.round(+e.target.value||0)));dirty=true;updateStatus()};
document.querySelectorAll('[data-mode]').forEach(c=>c.onchange=()=>{draft.modes=[...document.querySelectorAll('[data-mode]')].filter(x=>x.checked).map(x=>x.dataset.mode);dirty=true;updateStatus();if(!draft.modes.length)flash('게임 방식을 하나 이상 골라요.')});
function flash(t){$('#status').textContent=t}
$('#saveBtn').onclick=async()=>{

  }else{
    if(ratio>=.7)burst();
    const title=ratio===1?'퀴즈 마스터':ratio>=.7?'에이스':ratio>=.35?'도전자':'새싹';
    const ns=ratio>=.8?3:ratio>=.5?2:G.right>=1?1:0;
    const stars=el('div',{class:'stars',role:'img','aria-label':`별 ${ns}개`});stars.innerHTML=star(ns>0)+star(ns>1)+star(ns>2);
    kids.push(el('div',{class:'pill',text:G.mode==='practice'?'연습 끝':`${G.name}의 결과`}),el('div',{class:'big',text:G.mode==='practice'?'연습 완료!':title}),stars);
    const cells=G.mode==='practice'?[[`${G.right}/${n}`,'처음부터 맞힌 문제'],[G.missSet.size,'다시 풀었던 문제']]:[[G.score,'점수'],[`${G.right}/${n}`,'정답'],[G.best,'최고 연속']];
    const sum=el('div',{class:'sum'});cells.forEach(([v,l])=>sum.append(el('div',{},[el('b',{text:v}),l])));kids.push(sum);
    if(G.mode==='ghost'){const gf=G.ghost[G.ghost.length-1]||0;const win=G.score>gf;
      kids.push(el('p',{text:win?`고스트(${gf}점)를 이겼어요!`:G.score===gf?`고스트(${gf}점)와 비겼어요.`:`고스트(${gf}점)에게 졌어요. 다시 도전해 봐요!`}));
      if(!G.ghostReal||G.score>gf){gSave(G.ghostKey,G.cum);kids.push(el('p',{text:'이번 기록이 다음 고스트가 돼요.'}))}}
    if(G.mode!=='practice'){const rev=el('div',{class:'rev','aria-label':'문제별 결과'});G.results.forEach((r,i)=>rev.append(el('i',{class:r?'ok':'no',text:i+1})));kids.push(rev)}
  }
  if(missList.length){const m=el('div',{class:'missed'},[el('b',{text:'다시 확인해요'})]);missList.forEach(q=>m.append(el('div',{},[q.q,el('br'),el('b',{text:'정답: '+correctText(q)})])));kids.push(m)}
  else kids.push(el('p',{text:'모든 문제를 맞혔어요! 정말 대단해요.'}));
  kids.push(again);game.replaceChildren(el('div',{class:'center'},kids))}

init();
</script>

</body></html>
